apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kquery
  labels:
    app: kquery
  annotations:
    # ---- SSE 关键配置（不配就会"流式变成一次性返回"或 60s 断开）----
    # ① 关闭响应缓冲：否则 nginx 会等后端把整个 SSE 读完才吐给前端
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # ② 读写超时放大到 300s：SSE 心跳 15s，但答案生成可能几十秒
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # ③ 明确不缓冲请求体（流式上传）
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: kquery.local
      http:
        paths:
          # 前端静态资源与后端 API 走同一个 host：前端 nginx 配置已按
          # /api 前缀分流（frontend/nginx.conf 的 location 清单）
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kquery-frontend
                port:
                  name: http
  # TLS 交给 cert-manager（生产）；本地验证用 kind + 假证书
  tls:
    - hosts: ["kquery.local"]
      secretName: kquery-tls
