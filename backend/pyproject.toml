[project]
name = "kquery-backend"
version = "0.1.0"
description = "Kquery 智能 RAG 后端（阶段 1：最小可用 RAG）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "dashscope>=1.20.0",
    "numpy>=1.26.0",
    "faiss-cpu>=1.8.0.post1",
    "pypdf>=4.2.0",
    "jieba>=0.42.1",
    "prometheus-client>=0.26.0",
    "pymilvus>=3.0.2",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-timeout>=2.3.1",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "milvus-lite>=3.2.1",
    "pillow>=12.3.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120 --timeout-method=thread"
# 超时是必需的而不是可选的：本项目大量测试涉及线程与 SSE 消费，
# 一旦某个消费者死锁，没有超时的话整个测试套件会静默挂住，
# 既看不出跑到哪一步，也没法区分"慢"和"死"。

[tool.coverage.report]
# 门槛取自 2026-10-16 实测基线（85%）略下调，留出余量避免阻塞开发；
# 后续批次改造完成后应逐步抬升（每批次 +2pp）。
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py311"
# 本项目大量使用中文注释与文档字符串，忽略行宽以外的风格争议项，
# 保持 lint 只抓真正的错误（未使用变量、未定义名、错误的 except 顺序等）
[tool.ruff.lint]
select = ["E", "F", "W"]
# E501 行宽由 line-length 控制；E203 与 black 冲突。
# E702/E741 放行：并发测试里的紧凑分号写法与单字母循环变量是刻意为之，
# 拆成多行反而更难读；lint 应只拦真实问题（F 类未使用/未定义、W292 缺尾换行）。
ignore = ["E501", "E203", "E702", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "W292"]
