# KQuery 测试环境基础设施（轻量版）
# 仅启动后端运行与运维能力测试所需的最小依赖：
#   Redis(26379) / MongoDB(27027) / Neo4j(27687)
# 注意：Milvus / ELK / Prometheus 等较重组件在此环境下省略，
# 相关运维能力会自动降级（graceful degradation），不影响接口可用性。
version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: kquery-test-redis
    ports:
      - "26379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: kquery-test-mongodb
    ports:
      - "27027:27017"
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5.18-community
    container_name: kquery-test-neo4j
    ports:
      - "27687:7687"
      - "27474:7474"
    environment:
      NEO4J_AUTH: neo4j/SecureNeo4j@2026
      NEO4J_dbms_security_auth__minimum__password__length: "8"
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
