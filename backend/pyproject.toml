[project]
name = "kquery-backend"
version = "0.1.0"
description = "Kquery 智能 RAG 后端（阶段 1：最小可用 RAG）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "dashscope>=1.20.0",
    "numpy>=1.26.0",
    "faiss-cpu>=1.8.0.post1",
    "pypdf>=4.2.0",
    "jieba>=0.42.1",
    "prometheus-client>=0.26.0",
    "pymilvus>=3.0.2",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "langgraph>=1.2.12",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "milvus-lite>=3.2.1",
    "pillow>=12.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
