# Kquery 单端口访问（本地独立实例版，对应 frontend/nginx.conf 的容器版）
#
# 一个 nginx 同时干两件事：托管前端静态产物 + 反向代理后端 API。
# 前端全是相对路径（fetch("/ask") 等），所以同源同端口，浏览器只需一个地址，
# 也不存在跨域问题。
#
# 独立实例运行，不读写系统 nginx.conf，避免影响本机其它项目：
#   cd deploy/nginx
#   nginx -p "$PWD" -c nginx.conf            # 启动
#   nginx -p "$PWD" -c nginx.conf -s reload  # 改完配置热加载
#   nginx -p "$PWD" -c nginx.conf -s quit    # 停止
#
# 与容器版的两处差异（其余路由规则完全一致）：
#   upstream  backend:8000        → 127.0.0.1:8010（后端跑在宿主机）
#   root      /usr/share/nginx/html → frontend/dist 绝对路径

worker_processes  1;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  logs/access.log;

    # 相对路径由 -p 指定的 prefix 解析，必须显式指到实例目录内，
    # 否则 nginx 会往系统目录写临时文件，多实例时会互相踩
    client_body_temp_path  temp/client_body;
    proxy_temp_path        temp/proxy;
    fastcgi_temp_path      temp/fastcgi;
    uwsgi_temp_path        temp/uwsgi;
    scgi_temp_path         temp/scgi;

    sendfile         on;
    keepalive_timeout  65;
    server_tokens    off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    upstream backend_upstream {
        # 与本地后端监听端口一致；容器重建/换端口时只改这一行。
        # 用 8100 而不是 8010：本机另一个项目在 0.0.0.0:8010 上有监听，
        # 同号双绑只是"当前谁更具体谁赢"，对方重启后可能把流量抢走，
        # 表现为 nginx 静默代理到错误的后端。避开端口段更省心。
        server 127.0.0.1:8100 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8081;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 64m;   # 必须大于后端 max_upload_mb(50)，否则大文件在 nginx 层
                                    # 就被拒，前端拿到 413 HTML 而不是后端的结构化错误信封

        # ---------- 运维端点：永远透传，不参与 SPA 分流 ----------
        # 探针/监控可能带 Accept: text/html，送进 SPA 分流会拿到 HTML，
        # 表现为"探针 200 但内容不是 JSON"，极难排查
        location ~ ^/(healthz|readyz|livez|health|metrics)$ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }

        # ---------- API / SPA 共用前缀的路径 ----------
        location ~ ^/(ask|knowledge|admin|feedback|sessions|graph|search|media|assets|metrics|health|auth)(/|$) {
            # 浏览器导航（Accept: text/html）→ 转 SPA 页面；fetch/SSE 不带 → 走 API
            error_page 418 = @spa;
            if ($http_accept ~* "text/html") {
                return 418;
            }

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # SSE（/ask/stream）：必须关缓冲，
            # 否则 nginx 攒满 buffer 才吐，token 变成"整段一次性出现"
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;   # 长回答/长时间工具调用可能跑几分钟，超时断了前端会误判失败
            proxy_send_timeout 600s;
        }

        # SSE 兜底：带路径参数的长流式端点不在上面的前缀正则里
        location ~ /stream$ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        # ---------- 带哈希的静态资源 ----------
        # 产物目录是 /static/ 不是 /assets/：后端 /assets/ 是媒体资源端点，
        # 两边同名会被上面的 API 正则抢走，页面直接白屏
        location ^~ /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html 不带哈希，必须禁缓存，否则发新版后用户还拿着旧 HTML
        # 去加载已经不存在的 JS
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ---------- SPA 兜底 ----------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带前缀路径的 SPA 页面入口（由上面 error_page 418 跳来）
        location @spa {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}