apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kquery-dev
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: kquery-backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
