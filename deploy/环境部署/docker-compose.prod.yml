# KQuery Pro 生产环境 - 基础设施服务
# 包含数据库、缓存、监控等支持性服务
# 配合 项目部署/docker-compose.prod.yml 使用

version: '3.8'

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==================== 数据存储层 ====================
  kquery-redis:
    image: redis:7-alpine
    container_name: kquery-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "36379:6379"
    volumes:
      - ../volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  kquery-etcd:
    container_name: kquery-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - ../volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    logging: *default-logging
    restart: unless-stopped

  kquery-minio:
    container_name: kquery-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "39001:9001"
      - "39000:9000"
    volumes:
      - ../volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  kquery-milvus:
    container_name: kquery-milvus
    image: milvusdb/milvus:v2.5.0
    command: ["milvus", "run", "standalone"]
    ports:
      - "39530:19530"
      - "39091:9091"
    environment:
      ETCD_ENDPOINTS: kquery-etcd:2379
      MINIO_ADDRESS: kquery-minio:9000
    volumes:
      - ../volumes/milvus:/var/lib/milvus
    depends_on:
      - kquery-etcd
      - kquery-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  kquery-neo4j:
    container_name: kquery-neo4j
    image: neo4j:5-community
    ports:
      - "37474:7474"
      - "37687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - ../volumes/neo4j/data:/data
      - ../volumes/neo4j/logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j_password", "RETURN 1"]
      interval: 30s
      timeout: 15s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # ==================== 监控与可观测性 ====================
  kquery-prometheus:
    image: prom/prometheus:v2.45.0
    container_name: kquery-prometheus
    ports:
      - "39090:9090"
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../volumes/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    logging: *default-logging
    restart: unless-stopped

  kquery-grafana:
    image: grafana/grafana:10.2.0
    container_name: kquery-grafana
    ports:
      - "33000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ../volumes/grafana:/var/lib/grafana
    depends_on:
      - kquery-prometheus
    logging: *default-logging
    restart: unless-stopped

  # ==================== 可选：Jaeger 链路追踪 ====================
  kquery-jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: kquery-jaeger
    ports:
      - "46686:16686"
      - "36831:6831/udp"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - tracing
