# KQuery Pro 项目部署 - 应用服务
# 包含后端 API、前端页面、反向代理
# 先启动 环境部署/docker-compose.yml 再启动本文件

services:
  kquery-api:
    build:
      context: ../../
      dockerfile: deploy/项目部署/backend/Dockerfile
    container_name: kquery-api
    ports:
      - "8000:8000"
    environment:
      - MILVUS_HOST=kquery-milvus
      - MILVUS_PORT=19530
      - REDIS_HOST=kquery-redis
      - REDIS_PORT=6379
      - MONGODB_HOST=kquery-mongodb
      - MONGODB_PORT=27017
      - NEO4J_URI=bolt://kquery-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=SecureNeo4j@2026
      - NEO4J_DATABASE=neo4j
    depends_on:
      kquery-milvus:
        condition: service_healthy
      kquery-redis:
        condition: service_healthy
      kquery-mongodb:
        condition: service_healthy
      kquery-neo4j:
        condition: service_healthy
    volumes:
      - ../../backend/data:/app/data
      - ../../backend/documents:/app/documents
    restart: unless-stopped

  kquery-nginx:
    image: nginx:alpine
    container_name: kquery-nginx
    ports:
      - "28080:80"
      - "28443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/dist:/app/frontend/dist:ro
    depends_on:
      - kquery-api
    restart: unless-stopped

  kquery-frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/项目部署/frontend/Dockerfile
    container_name: kquery-frontend
    ports:
      - "3000:3000"
    depends_on:
      - kquery-api
    restart: unless-stopped
