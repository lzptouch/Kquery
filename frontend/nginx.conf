# 前端静态资源 + API 反向代理（stage-10 §6）
#
# 核心难点：SPA 页面路由与 API 端点共用路径前缀（/knowledge、/admin、/graph…）。
# 浏览器导航带 Accept: text/html，fetch/xhr 不带——靠这个差异分流，
# 规则与 vite.config.ts 的 bypass 保持一致，两种部署下行为必须相同。
#
# 两个踩过的坑，都写在注释里免得再踩：
#  1. `proxy_pass` 里用变量（set $backend）需要 resolver 才能解析 Docker 服务名，
#     nginx 自带 resolver 不认 Docker 内嵌 DNS，会报 "no resolver defined to
#     resolve backend" 并返回 502。改用 upstream 在启动时解析一次。
#  2. `if (...) { rewrite ... break; }` 改不出 SPA 页面——break 只停止后续 rewrite，
#     location 匹配已经定了，不会重新走 try_files，结果是 404。
#     必须用 error_page 做内部跳转，交给 @spa 处理。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;   # 必须大于后端 max_upload_mb，否则大文件在 nginx 层就被拒，
                                # 前端拿到的是 413 HTML 而不是后端的结构化错误信封

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 运维端点：永远透传，不参与 SPA 分流 ----------
    # 监控与探针会带各种 Accept（含 text/html 的浏览器插件、健康检查工具）。
    # 这些端点必须原样返回 JSON——把它们送进 SPA 分流会得到一段 HTML，
    # 表现为"探针 200 但内容不是 JSON"，排查时很难看出是代理层搞错了。
    location ~ ^/(healthz|readyz|livez|health|metrics)$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # ---------- API / SPA 共用前缀的路径 ----------
    location ~ ^/(ask|knowledge|admin|feedback|sessions|graph|search|media|assets|metrics|health|auth)(/|$) {
        # 浏览器导航（Accept: text/html）→ 转 SPA 页面
        error_page 418 = @spa;
        if ($http_accept ~* "text/html") {
            return 418;
        }

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE（/ask/stream）：必须关缓冲，
        # 否则 nginx 会攒满 buffer 才吐给前端，token 就变成"整段一次性出现"
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;   # 长回答/长时间工具调用可能跑几分钟，超时断了前端会误判失败
        proxy_send_timeout 600s;
    }

    # SSE 兜底：带路径参数的长流式端点不在上面的前缀正则里
    location ~ /stream$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # ---------- 带哈希的静态资源 ----------
    # vite 产物带内容哈希，可以永久缓存；index.html 不带哈希，必须禁缓存，
    # 否则发新版后用户还拿着旧 HTML 去加载已经不存在的 JS。
    #
    # 用 ^~ 而不是普通前缀：^~ 表示"匹配到我就停，不再检查正则 location"。
    # 不加的话 /static/xxx.js 也会落进下面的 API 正则里被代理给后端。
    # 注意产物目录是 /static/ 不是 /assets/ —— 后端的 /assets/ 是媒体资源端点。
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------- SPA 兜底 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带前缀路径的 SPA 页面入口（由上面 error_page 418 跳来）
    location @spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

upstream backend_upstream {
    # 与 compose 里的服务名对应；容器重建 IP 会变，靠启动时解析一次即可
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}