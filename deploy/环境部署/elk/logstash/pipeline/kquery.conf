input {
  tcp {
    port => 5045
    codec => json_lines {
      charset => "UTF-8"
    }
    tags => ["kquery", "app"]
  }

  beats {
    port => 5044
    tags => ["kquery", "beats"]
  }
}

filter {
  if "kquery" in [tags] {
    if [message] =~ /^\{.*\}$/ {
      json {
        source => "message"
        target => "parsed"
      }
    }

    if [parsed][level] {
      mutate {
        uppercase => ["[parsed][level]"]
      }
    }

    mutate {
      add_field => {
        "[@metadata][target_index]" => "kquery-logs-%{+YYYY.MM.dd}"
        "application" => "kquery-pro"
      }
    }

    if [parsed][event_type] {
      mutate {
        add_field => { "log_category" => "audit" }
      }
    } else if [parsed][request_id] or [parsed][method] {
      mutate {
        add_field => { "log_category" => "access" }
      }
    } else if [parsed][level] == "ERROR" or [parsed][level] == "CRITICAL" {
      mutate {
        add_field => { "log_category" => "error" }
      }
    } else {
      mutate {
        add_field => { "log_category" => "application" }
      }
    }

    mutate {
      remove_field => ["@version"]
    }
  }
}

output {
  if [@metadata][target_index] {
    elasticsearch {
      hosts => ["http://${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}"]
      index => "%{[@metadata][target_index]}"
    }
  } else {
    elasticsearch {
      hosts => ["http://${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}"]
      index => "kquery-logs-%{+YYYY.MM.dd}"
    }
  }
}
