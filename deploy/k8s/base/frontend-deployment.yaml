apiVersion: apps/v1
kind: Deployment
metadata:
  name: kquery-frontend
  labels:
    app: kquery
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kquery
      component: frontend
  template:
    metadata:
      labels:
        app: kquery
        component: frontend
    spec:
      # 注意：前端镜像（nginx）未按 rootless 构建——运行时要写
      # /var/cache/nginx 与 /var/run，强跑非 root 会启动即崩。
      # 与 compose 行为一致先以镜像默认用户跑；镜像改造后再加回 securityContext。
      containers:
        - name: frontend
          image: kquery/frontend:latest
          ports:
            - name: http
              # 前端镜像的 nginx listen 8080（deploy/docker/frontend.nginx.conf），
              # 此前写 80 同样探针全挂。
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: kquery-frontend
  labels:
    app: kquery
    component: frontend
spec:
  selector:
    app: kquery
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
