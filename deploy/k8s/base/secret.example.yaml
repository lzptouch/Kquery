# 密钥模板：**不要 apply 这个文件**，也不在 kustomization 的 resources 里。
#
# 原因：清单里的 Secret 每次 `kubectl apply -k` 都会把占位值写回，
# 覆盖掉你注入的真实密钥（apply 是三方合并，只改写出现的字段）。
# 所以真实密钥只走下面这条命令创建，之后不要再 apply 清单里的 Secret：
#
#   kubectl -n kquery-dev create secret generic kquery-secrets \
#     --from-literal=deepseek-api-key="$DEEPSEEK_API_KEY" \
#     --from-literal=minimax-api-key="$MINIMAX_API_KEY" \
#     --from-literal=dashscope-api-key="$DASHSCOPE_API_KEY" \
#     --from-literal=metrics-token="$(openssl rand -hex 16)" \
#     --dry-run=client -o yaml | kubectl replace -f -
#
# 生产环境用 ExternalSecrets / SealedSecrets 管理，不要手填。
#
# 键名说明（键名变了要同步改 backend-deployment.yaml 的 envFrom/valueFrom）：
#   deepseek-api-key  → DEEPSEEK_API_KEY（生成 + 重排）
#   minimax-api-key   → MINIMAX_API_KEY（向量化）
#   dashscope-api-key → DASHSCOPE_API_KEY（OCR / 备用）
#   redis-url         → REDIS_URL（**可选**；不配就是单副本语义，
#                       配了但连不上会让 /readyz 一直 503 把 Pod 摘掉）
#   metrics-token     → METRICS_TOKEN（/metrics 鉴权）
apiVersion: v1
kind: Secret
metadata:
  name: kquery-secrets
  labels:
    app: kquery
type: Opaque
stringData:
  deepseek-api-key: "REPLACE_ME"
  minimax-api-key: "REPLACE_ME"
  dashscope-api-key: "REPLACE_ME"
  metrics-token: "REPLACE_ME"
  # redis-url: "redis://user:pass@kquery-redis:6379/0"
