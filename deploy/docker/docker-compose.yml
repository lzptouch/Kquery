# Kquery 全栈编排（）
#
# 本文件位于 deploy/docker/，build context 指回仓库根（../..），
# 因此构建命令与起法都要在本目录执行：
#   cd deploy/docker
#   docker compose up -d --build      # 构建并启动全栈
#   docker compose logs -f backend    # 看后端日志
#   docker compose down               # 停止
#   docker compose down -v            # 连同数据卷一起清（会丢向量索引与审计日志）
#
# 依赖顺序靠 healthcheck gate：后端等 Milvus 真健康再启动，
# 否则第一次启动时后端连不上向量库就直接崩，容器进入 restart 循环。

name: kquery

services:
  # ---------------------------------------------------------------- 向量数据库
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: kquery-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.4
    container_name: kquery-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      # 宿主 19530 已被本机其它容器（svc04-milvus）占用，改用 19531；
      # 容器内仍是 19530，KQUERY_MILVUS_URI=http://milvus:19530 不受影响。
      - "19531:19530"   # gRPC：pymilvus 走这个
      - "9092:9091"     # 健康检查 / 指标
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s   # Milvus 冷启动要加载本地存储，30s 会一直判定 unhealthy
    restart: unless-stopped

  # ---------------------------------------------------------------- 共享状态（Redis）
  # 多副本部署时，限流/配额/语义缓存必须跨副本共享，
  # 否则实际放行量 = 配置值 × 副本数（限流最常见的失效原因）。
  # 后端对 Redis 是 Fail-Open：Redis 挂了就降级为进程内，服务不中断。
  redis:
    image: redis:7-alpine
    container_name: kquery-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "6381:6379"      # 宿主 6381 → 容器 6379（6379/6380 均被本机其它容器占用）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------- 后端
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    image: kquery-backend:latest
    container_name: kquery-backend
    env_file:
      - ../../backend/.env      # 密钥从这里注入，不进镜像层
    environment:
      # 覆盖 .env 里面向本机的地址：容器内走服务名，不是 localhost
      KQUERY_MILVUS_URI: http://milvus:19530
      VECTOR_STORE: milvus
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
      CACHE_BACKEND: auto
    volumes:
      - backend_data:/data       # 向量索引 / 图谱快照 / 审计日志 / 备份
    ports:
      - "8100:8000"      # 宿主 8100 → 容器 8000（8000 被本机 KAiSupport 占用）
    depends_on:
      # 必须等 init 建表完成：后端启动时会 load 集合，
      # 集合不存在会直接抛异常，容器进入 restart 循环
      init:
        condition: service_completed_successfully
      # Redis 是可选依赖：healthcheck 只是避免启动瞬间连不上，
      # 连不上时后端会自行降级为进程内（Fail-Open）
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 一次性初始化：建 Milvus 集合与索引。独立成服务而不是放在后端启动流程里，
  # 是为了让"建表"这件事只发生一次且可见——多副本后端同时建表会失败。
  init:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    image: kquery-backend:latest
    container_name: kquery-init
    depends_on:
      milvus:
        condition: service_healthy
    environment:
      KQUERY_MILVUS_URI: http://milvus:19530
      VECTOR_STORE: milvus
      DATA_DIR: /data
      MODEL_PROVIDER: mock        # 初始化不需要真实模型
    volumes:
      - backend_data:/data
    entrypoint: ["python", "-c"]
    command:
      - |
        import sys, time
        from app.core.config import get_settings
        from app.services.milvus_store import MilvusVectorStore

        s = get_settings()
        store = MilvusVectorStore(uri=s.milvus_uri, dim=s.embedding_dim)
        # Milvus 刚 healthy 时端口已开但 collection API 可能还在初始化，
        # 一次失败不代表起不来，所以要重试
        for attempt in range(30):
            try:
                store.load()
                print(f"[init] Milvus 集合就绪: {store._collection} ({s.embedding_dim} 维)", flush=True)
                sys.exit(0)
            except Exception as exc:
                print(f"[init] 第 {attempt + 1}/30 次尝试失败: {exc}", flush=True)
                time.sleep(2)
        print("[init] 初始化失败：Milvus 30 次重试均未成功", flush=True)
        sys.exit(1)
    restart: "no"

  # ---------------------------------------------------------------- 前端
  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: kquery-frontend:latest
    container_name: kquery-frontend
    ports:
      - "8090:8080"      # 宿主 8090 → 容器 8080（8080/8081 已被本机其它容器占用）
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  etcd_data:
  milvus_data:
  backend_data:
  redis_data: