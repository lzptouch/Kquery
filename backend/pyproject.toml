[project]
name = "kquery-backend"
version = "0.1.0"
description = "Kquery 智能 RAG 后端（阶段 1：最小可用 RAG）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "dashscope>=1.20.0",
    "numpy>=1.26.0",
    "faiss-cpu>=1.8.0.post1",
    "pypdf>=4.2.0",
    "jieba>=0.42.1",
    "prometheus-client>=0.26.0",
    "pymilvus>=3.0.2",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "openpyxl>=3.1.5",
    # F9：PPT/PPTX 解析（python-pptx，纯 Python，不需要 Office）
    "python-pptx>=1.0.2",
    "redis>=5.0",
    # 出站 HTTP 客户端：多模态 OCR / 外部 provider 探测 / 测试中的 ASGI 客户端都用它。
    # 原先只在 dev 组（测试用），生产运行时不可用——已上移到主依赖。
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.48",
    "pytest-playwright>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-timeout>=2.3.1",
    "pytest-cov>=5.0.0",
    "pillow>=12.3.0",
    "ruff>=0.6.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
package = false

# 注：pytest / coverage / ruff 的配置在**仓库根**的 pyproject.toml
# （测试目录 tests/ 已上移到根，配置留在 backend/ 会被 pytest 完全忽略）。
