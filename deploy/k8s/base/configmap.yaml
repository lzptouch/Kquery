apiVersion: v1
kind: ConfigMap
metadata:
  name: kquery-config
  labels:
    app: kquery
data:
  # 非敏感配置放这里（敏感值走 Secret）
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
  AGENT_MODE: "plan_execute"
  AGENT_TOKEN_BUDGET: "20000"
  AGENT_DEADLINE_MS: "60000"
  ASK_DEADLINE_MS: "120000"
  HEALTH_PROBE_TIMEOUT_S: "1.0"
  # 限流与上游许可（容量口径见 scripts/capacity.py）
  PIPELINE_WORKERS: "32"
  UPSTREAM_LLM_PERMITS: "12"
  UPSTREAM_EMBEDDING_PERMITS: "4"
  UPSTREAM_RERANK_PERMITS: "2"
  UPSTREAM_MILVUS_PERMITS: "8"
  RETRIEVAL_CONFIG_APPLY_DELAY_S: "300"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kquery-data
  labels:
    app: kquery
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# 真实值**不要**提交进仓库：用 ExternalSecrets / SealedSecrets / kubectl create secret
apiVersion: v1
kind: Secret
metadata:
  name: kquery-secrets
  labels:
    app: kquery
type: Opaque
stringData:
  # 占位值：部署前必须替换（CI 有守卫检查不允许提交真实密钥）
  dashscope-api-key: "REPLACE_ME"
  redis-url: "redis://kquery:REPLACE_ME@kquery-redis:6379/0"
  metrics-token: "REPLACE_ME"
