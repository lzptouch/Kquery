# KQuery Pro 生产环境 - 应用服务
# 包含 API 网关、前端、Celery 工作节点、反向代理
# 先启动 环境部署/docker-compose.prod.yml 再启动本文件

version: '3.8'

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck:
  &api-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

networks:
  kquery-net:
    driver: bridge

services:
  # ============================================
  # 反向代理与负载均衡
  # ============================================
  kquery-nginx:
    image: nginx:alpine
    container_name: kquery-nginx
    ports:
      - "38080:80"
      - "38443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/ssl:/etc/nginx/ssl:ro
      - ./data/static:/var/www/static:ro
    depends_on:
      - api-gateway-1
      - api-gateway-2
    logging: *default-logging
    restart: unless-stopped
    networks:
      - kquery-net

  # ============================================
  # API网关层 - 无状态，可水平扩展
  # ============================================
  kquery-api-1:
    build:
      context: ../../
      dockerfile: deploy/项目部署/backend/Dockerfile
    container_name: kquery-api-1
    environment:
      - INSTANCE_ID=api-1
      - LAYER=L2
      - REDIS_URL=redis://kquery-redis:6379/0
      - MILVUS_HOST=kquery-milvus
      - NEO4J_URI=bolt://kquery-neo4j:7687
    depends_on:
      kquery-redis:
        condition: service_healthy
    healthcheck: *api-healthcheck
    logging: *default-logging
    restart: unless-stopped
    networks:
      - kquery-net

  kquery-api-2:
    build:
      context: ../../
      dockerfile: deploy/项目部署/backend/Dockerfile
    container_name: kquery-api-2
    environment:
      - INSTANCE_ID=api-2
      - LAYER=L2
      - REDIS_URL=redis://kquery-redis:6379/0
      - MILVUS_HOST=kquery-milvus
      - NEO4J_URI=bolt://kquery-neo4j:7687
    depends_on:
      kquery-redis:
        condition: service_healthy
    healthcheck: *api-healthcheck
    logging: *default-logging
    restart: unless-stopped
    networks:
      - kquery-net

  # ============================================
  # 前端服务
  # ============================================
  kquery-frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/项目部署/frontend/Dockerfile
    container_name: kquery-frontend
    environment:
      - VITE_API_BASE_URL=/api/v1
    logging: *default-logging
    restart: unless-stopped
    networks:
      - kquery-net

  # ============================================
  # Celery 工作节点
  # ============================================
  kquery-celery-1:
    build:
      context: ../../
      dockerfile: deploy/项目部署/backend/Dockerfile
    container_name: kquery-celery-1
    command: celery -A celery_config worker -l info -Q default,documents,graphs
    environment:
      - INSTANCE_ID=celery-1
      - LAYER=L3
      - REDIS_URL=redis://kquery-redis:6379/0
    depends_on:
      kquery-redis:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    networks:
      - kquery-net

  kquery-celery-2:
    build:
      context: ../../
      dockerfile: deploy/项目部署/backend/Dockerfile
    container_name: kquery-celery-2
    command: celery -A celery_config worker -l info -Q documents,graphs
    environment:
      - INSTANCE_ID=celery-2
      - LAYER=L3
      - REDIS_URL=redis://kquery-redis:6379/0
    depends_on:
      kquery-redis:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    networks:
      - kquery-net
