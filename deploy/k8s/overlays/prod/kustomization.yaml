apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kquery
resources:
  - ../../base
  # 告警规则**不在**这里：deploy/prometheus-rules.yaml 是 Prometheus 的
  # rule_files 格式（groups/rules），不是 Kubernetes 资源——塞进 resources
  # 会因「missing Resource metadata」渲染失败。要用 prometheus-operator
  # 请把它转成 PrometheusRule CRD 再纳入清单。
patches:
  - target:
      kind: Deployment
      name: kquery-backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
