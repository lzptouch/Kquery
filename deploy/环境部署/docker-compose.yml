# KQuery Pro 环境部署 - 基础设施服务
# 包含数据库、消息队列、监控、日志等支持性服务
# 配合项目部署/docker-compose.yml 使用

services:
  # ==================== 向量数据库 ====================
  kquery-etcd:
    container_name: kquery-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ../volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://kquery-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  kquery-minio:
    container_name: kquery-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "29001:9001"
      - "29000:9000"
    volumes:
      - ../volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  kquery-milvus:
    container_name: kquery-milvus
    image: milvusdb/milvus:v2.5.0
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=kquery-etcd:2379
      - MINIO_ADDRESS=kquery-minio:9000
      - MINIO_ACCESS_KEY=miniouser
      - MINIO_SECRET_KEY=SecureMinio@2026
      - MINIO_USE_SSL=false
      - MINIO_BUCKET_NAME=a-bucket
      - COMMON_SECURITY_ENABLED=false
    volumes:
      - ../data/milvus:/var/lib/milvus
    ports:
      - "29530:19530"
      - "29091:9091"
    depends_on:
      kquery-etcd:
        condition: service_healthy
      kquery-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 180s
      timeout: 20s
      retries: 3

  # ==================== 缓存与数据存储 ====================
  kquery-redis:
    container_name: kquery-redis
    image: redis:7-alpine
    ports:
      - "26379:6379"
    volumes:
      - ../volumes/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  kquery-mongodb:
    container_name: kquery-mongodb
    image: mongo:7
    ports:
      - "27027:27017"
    volumes:
      - ../volumes/mongodb:/data/db
    environment:
      - MONGO_INITDB_DATABASE=kquery_logs
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  kquery-neo4j:
    container_name: kquery-neo4j
    image: neo4j:5-community
    ports:
      - "27474:7474"
      - "27687:7687"
    volumes:
      - ../volumes/neo4j/data:/data
      - ../volumes/neo4j/logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/SecureNeo4j@2026
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "SecureNeo4j@2026", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ==================== 监控系统 ====================
  kquery-prometheus:
    container_name: kquery-prometheus
    image: prom/prometheus:latest
    user: "0:0"
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ../volume_data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  kquery-grafana:
    container_name: kquery-grafana
    image: grafana/grafana:latest
    user: "0:0"
    ports:
      - "23000:3000"
    volumes:
      - ../volume_data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=securepassword
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - kquery-prometheus
    restart: unless-stopped

  # ==================== ELK 日志服务 ====================
  kquery-elasticsearch:
    container_name: kquery-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=kquery-logs
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ../volumes/elasticsearch/data:/usr/share/elasticsearch/data
    ports:
      - "29200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  kquery-logstash:
    container_name: kquery-logstash
    image: docker.elastic.co/logstash/logstash:8.17.0
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "25044:5044"
      - "25045:5045/tcp"
      - "25045:5045/udp"
      - "29600:9600"
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - ELASTICSEARCH_HOST=kquery-elasticsearch
      - ELASTICSEARCH_PORT=9200
    depends_on:
      kquery-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600/_node/pipelines || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  kquery-kibana:
    container_name: kquery-kibana
    image: docker.elastic.co/kibana/kibana:8.17.0
    volumes:
      - ./elk/kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "25601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://kquery-elasticsearch:9200
    depends_on:
      kquery-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
